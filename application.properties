spring.application.name=broadband-management
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/broadband_monitoring?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.check-template-location=false

# Rules can be tuned without changing Java code.
broadband.simulation.enabled=${SIMULATION_ENABLED:true}
broadband.simulation.auto-create-incidents=${AUTO_CREATE_INCIDENTS:true}
broadband.risk.high-threshold=70
